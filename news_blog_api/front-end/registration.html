<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реєстрація — News Blog</title>
  <link rel="stylesheet" href="css_for_loginpage.css">
</head>
<body>
  <header>
    <div class="header-container">
      <a href="/" class="logo">News Blog</a>
      <div class="header-actions">
        <a href="login.html" class="btn btn-secondary">Назад</a>
      </div>
    </div>
  </header>

 <div class="login-container">
    <h1>Реєстрація</h1>
    <form id="registrationForm">
      <div class="form-group">
        <label for="username">Ім'я користувача </label>
        <input type="text" id="username" name="username" required placeholder="Введіть username">
      </div>

      <div class="form-group">
        <label for="first_name">Ім'я (необов'язково)</label>
        <input type="text" id="first_name" name="first_name" placeholder="Введіть ім'я">
      </div>

      <div class="form-group">
        <label for="second_name">Прізвище (необов'язково)</label>
        <input type="text" id="second_name" name="second_name" placeholder="Введіть прізвище">
      </div>

      <div class="form-group">
        <label for="email">Електронна пошта </label>
        <input type="email" id="email" name="email" required placeholder="Введіть email">
        <div class="error-message" id="emailError"></div>
      </div>

      <div class="form-group">
        <label for="password">Пароль </label>
        <input type="password" id="password" name="password" required placeholder="Мінімум 8 символів, велика літера, цифра">
      </div>

      <div class="form-group">
        <label for="cpassword">Повторіть пароль </label>
        <input type="password" id="cpassword" name="cpassword" required placeholder="Введіть пароль ще раз">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Зареєструватися</button>

      <div class="form-footer">
        <a href="login.html" class="link">Вже маєте акаунт?</a>
      </div>
    </form>
    <div id="message" style="margin-top: 16px;"></div>
  </div>

  <script>
    document.getElementById('registrationForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const first_name = document.getElementById('first_name').value.trim();
    const last_name = document.getElementById('second_name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const cpassword = document.getElementById('cpassword').value;
    const messageDiv = document.getElementById('message');

    messageDiv.textContent = '';

    if (!email.includes('@gmail.com')) {
    messageDiv.style.color = 'red';
    messageDiv.textContent = 'Введіть правильний email';
    return;
  }

    if (password !== cpassword) {
    messageDiv.style.color = 'red';
    messageDiv.textContent = 'Паролі не співпадають';
    return;
  }

    const data = {
    username,
    first_name,
    last_name,
    email,
    password,
    password_check: cpassword
  };

    try {
    const response = await fetch('http://127.0.0.1:8000/api/auth/register/', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  });

    if (!response.ok) {
    const errData = await response.json();

    let errorMsg = '';
    for (let field in errData) {
    errorMsg += `${field}: ${errData[field]}\n`;
  }
    throw new Error(errorMsg || 'Помилка реєстрації');
  }

    const result = await response.json();
    messageDiv.style.color = 'green';
    messageDiv.textContent = result.message || 'Реєстрація успішна!';

    setTimeout(() => {
    window.location.href = 'login.html';
  }, 1500);

  } catch (error) {
    console.error(error);
    messageDiv.style.color = 'red';
    messageDiv.textContent = error.message;
  }
  });
</script>
