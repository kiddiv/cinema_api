<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Деталі статті - News Blog</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .back-button {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin-bottom: 1rem;
            display: inline-block;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .back-button:hover {
            background: #f8f9fa;
            transform: translateX(-5px);
        }

        .article-detail {
            background: white;
            border-radius: 15px;
            padding: 3rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 2rem;
        }

        .article-header {
            border-bottom: 3px solid #667eea;
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }

        .article-title {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .article-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #666;
            font-size: 0.95rem;
        }

        .article-author {
            font-weight: 600;
            color: #667eea;
            font-size: 1.1rem;
        }

        .article-stats {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.1rem;
        }

        .article-content {
            color: #333;
            line-height: 1.8;
            font-size: 1.1rem;
            margin: 2rem 0;
            white-space: pre-wrap;
        }

        .article-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid #f0f0f0;
            flex-wrap: wrap;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            font-weight: 600;
        }

        button:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .like-button.liked {
            background: #dc3545;
        }

        .like-button.liked:hover {
            background: #c82333;
        }

        .delete-btn {
            background: #dc3545;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .comments-section {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .comments-header {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        .comment-form {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 2rem;
        }

        .comment-form textarea {
            width: 100%;
            padding: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            min-height: 100px;
            margin-bottom: 1rem;
        }

        .comment-form textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .comment-item {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            border-left: 4px solid #667eea;
        }

        .comment-author {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 0.5rem;
        }

        .comment-content {
            color: #333;
            line-height: 1.6;
            margin-bottom: 0.5rem;
        }

        .comment-date {
            color: #999;
            font-size: 0.85rem;
        }

        .loading-spinner {
            text-align: center;
            padding: 3rem;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee;
            border-left: 4px solid #dc3545;
            color: #c33;
            padding: 1.5rem;
            border-radius: 8px;
            margin: 2rem 0;
        }

        .empty-comments {
            text-align: center;
            padding: 2rem;
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← Назад до списку</a>

        <div id="articleContainer">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p style="margin-top: 1rem; color: white; font-size: 1.2rem;">Завантаження статті...</p>
            </div>
        </div>

        <div id="commentsContainer" style="display: none;">
            <div class="comments-section">
                <h2 class="comments-header">💬 Коментарі</h2>

                <div class="comment-form">
                    <textarea id="commentText" placeholder="Напишіть свій коментар..."></textarea>
                    <button id="addCommentBtn">Додати коментар</button>
                </div>

                <div id="commentsList">
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000/api/v1';
        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        let currentArticle = null;
        let isLiked = false;

        if (!articleId) {
            alert('ID статті не вказано');
            window.location.href = 'index.html';
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('uk-UA', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function showError(container, error) {
            container.innerHTML = `
                <div class="error-message">
                    <h3> Помилка завантаження</h3>
                    <p><strong>Деталі:</strong> ${error.message}</p>
                    <button onclick="location.reload()">Спробувати ще раз</button>
                </div>
            `;
        }

        async function loadArticle() {
            const container = document.getElementById('articleContainer');

            try {
                const response = await fetch(`${API_BASE_URL}/articles/${articleId}/`);

                if (!response.ok) {
                    throw new Error(`Стаття не знайдена (HTTP ${response.status})`);
                }

                currentArticle = await response.json();
                isLiked = currentArticle.is_liked || false;

                container.innerHTML = `
                    <div class="article-detail">
                        <div class="article-header">
                            <h1 class="article-title">${currentArticle.title}</h1>
                            <div class="article-meta">
                                <div>
                                    <div class="article-author">👤 ${currentArticle.author.username}</div>
                                    <small>${formatDate(currentArticle.created_at)}</small>
                                </div>
                                <div class="article-stats">
                                    <span class="stat" title="Лайки">❤️ <span id="likesCount">${currentArticle.likes_count}</span></span>
                                    <span class="stat" title="Коментарі">💬 ${currentArticle.comments_count}</span>
                                </div>
                            </div>
                        </div>

                        <div class="article-content">${currentArticle.content}</div>

                        <div class="article-actions">
                            <button id="likeBtn" class="like-button ${isLiked ? 'liked' : ''}">
                                ${isLiked ? '💔 Прибрати лайк' : '❤️ Лайкнути'}
                            </button>
                            <button id="editBtn">✏ Редагувати</button>
                            <button id="deleteBtn" class="delete-btn">🗑 Видалити</button>
                        </div>
                    </div>
                `;

                document.getElementById('likeBtn').addEventListener('click', toggleLike);
                document.getElementById('editBtn').addEventListener('click', editArticle);
                document.getElementById('deleteBtn').addEventListener('click', deleteArticle);

                document.getElementById('commentsContainer').style.display = 'block';
                loadComments();

            } catch (error) {
                console.error('Error loading article:', error);
                showError(container, error);
            }
        }

        async function loadComments() {
            const commentsList = document.getElementById('commentsList');

            try {
                const response = await fetch(`${API_BASE_URL}/articles/${articleId}/comments/`);

                if (!response.ok) {
                    throw new Error('Не вдалось завантажити коментарі');
                }

                const result = await response.json();
                const comments = result.data || result;

                if (!comments || comments.length === 0) {
                    commentsList.innerHTML = '<div class="empty-comments">Коментарів поки немає. Будьте першим! 💭</div>';
                    return;
                }

                commentsList.innerHTML = comments.map(comment => `
                    <div class="comment-item">
                        <div class="comment-author">👤 ${comment.author.username}</div>
                        <div class="comment-content">${comment.content}</div>
                        <div class="comment-date">🕒 ${formatDate(comment.created_at)}</div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error loading comments:', error);
                commentsList.innerHTML = '<div class="error-message">Помилка завантаження коментарів</div>';
            }
        }

        async function addComment() {
            const commentText = document.getElementById('commentText').value.trim();
            const btn = document.getElementById('addCommentBtn');

            if (!commentText) {
                alert(' Введіть текст коментаря');
                return;
            }

            try {
                btn.disabled = true;
                btn.textContent = 'Додаємо...';

                const response = await fetch(`${API_BASE_URL}/articles/${articleId}/comments/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        content: commentText,
                        author_id: 1
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(JSON.stringify(errorData));
                }

                document.getElementById('commentText').value = '';
                alert(' Коментар додано!');
                loadComments();
                loadArticle();

            } catch (error) {
                console.error('Error adding comment:', error);
                alert(' Помилка додавання коментаря: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Додати коментар';
            }
        }

        async function toggleLike() {
            const btn = document.getElementById('likeBtn');
            const likesCount = document.getElementById('likesCount');

            try {
                btn.disabled = true;

                const method = isLiked ? 'DELETE' : 'POST';
                const response = await fetch(`${API_BASE_URL}/articles/${articleId}/like/`, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ user_id: 1 })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Помилка');
                }

                const result = await response.json();
                likesCount.textContent = result.likes_count;

                isLiked = !isLiked;
                btn.className = `like-button ${isLiked ? 'liked' : ''}`;
                btn.textContent = isLiked ? '💔 Прибрати лайк' : '❤️ Лайкнути';

            } catch (error) {
                console.error('Error toggling like:', error);
                alert(' ' + error.message);
            } finally {
                btn.disabled = false;
            }
        }

        function editArticle() {
            const newTitle = prompt(' Введіть новий заголовок:', currentArticle.title);
            if (!newTitle) return;

            const newContent = prompt(' Введіть новий контент:', currentArticle.content);
            if (!newContent) return;

            updateArticle(newTitle, newContent);
        }

        async function updateArticle(title, content) {
            try {
                const response = await fetch(`${API_BASE_URL}/articles/${articleId}/`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        title: title,
                        content: content,
                        author_id: currentArticle.author.id
                    })
                });

                if (!response.ok) {
                    throw new Error('Не вдалось оновити статтю');
                }

                alert(' Статтю оновлено');
                loadArticle();

            } catch (error) {
                console.error('Error updating article:', error);
                alert(' Помилка оновлення: ' + error.message);
            }
        }

        async function deleteArticle() {
            if (!confirm(' Ви впевнені, що хочете видалити цю статтю?\n\nЦю дію неможливо скасувати!')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/articles/${articleId}/`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Не вдалось видалити статтю');
                }

                alert(' Статтю видалено!');
                window.location.href = 'index.html';

            } catch (error) {
                console.error('Error deleting article:', error);
                alert(' Помилка видалення: ' + error.message);
            }
        }

        document.getElementById('addCommentBtn').addEventListener('click', addComment);

        document.getElementById('commentText').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                addComment();
            }
        });

        window.addEventListener('DOMContentLoaded', loadArticle);
    </script>
</body>
</html>
