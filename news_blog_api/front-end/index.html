<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Blog</title>
    <link rel="stylesheet" href="index_css.css">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="/" class="logo">News Blog</a>
            <div class="header-actions">
                <button class="btn btn-secondary" id="loadArticles">Оновити</button>
                <button class="btn btn-primary" id="createArticle">Написати</button>

                <a href="login.html" id="loginBtn" class="btn btn-primary" style="display: none;">Увійти</a>

                <span id="userInfo" style="margin-right: 16px; color: #333; font-weight: 500;"></span>
                <button id="logoutBtn" class="btn btn-secondary" style="display: none;">Вийти</button>
            </div>
        </div>
    </header>

    <div class="hero">
        <div class="hero-content">
            <h1>Stay curious.</h1>
            <p>Discover stories, thinking, and expertise from writers on any topic.</p>
        </div>
    </div>

    <div class="container">
        <div class="status-bar" id="statusBar" style="display: none;">
            <span class="status-dot"></span>
            <span id="statusText">Завантаження...</span>
        </div>

        <div class="articles-header">
            <h2>Останні статті</h2>
            <div class="filter-tabs">
                <button class="filter-tab active">Всі</button>
                <button class="filter-tab">Популярні</button>
                <button class="filter-tab">Нові</button>
            </div>
        </div>

        <div id="articlesContainer">
            <div class="empty-state">
                <h2>Ласкаво просимо</h2>
                <p>Завантажуємо статті з вашого API...</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000/api/v1';

        const statusBar = document.getElementById('statusBar');
        const statusText = document.getElementById('statusText');
        const articlesContainer = document.getElementById('articlesContainer');
        const loadBtn = document.getElementById('loadArticles');
        const createBtn = document.getElementById('createArticle');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userInfo = document.getElementById('userInfo');

        function checkAuth() {
            const accessToken = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (accessToken && user.username) {
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'inline-block';
                userInfo.textContent = `Привіт, ${user.username}!`;
                userInfo.style.display = 'inline-block';
                return true;
            } else {
                return false;
            }
        }

        async function logout() {
            const refreshToken = localStorage.getItem('refresh_token');
            const accessToken = localStorage.getItem('access_token');

            try {
                await fetch('http://127.0.0.1:8000/api/auth/logout/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: JSON.stringify({ refresh: refreshToken })
                });
            } catch (error) {
                console.error('Logout error:', error);
            }

            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('user');
            window.location.reload();
        }

        logoutBtn.addEventListener('click', logout);

        function setStatus(message) {
            statusBar.style.display = 'flex';
            statusText.textContent = message;
        }

        function hideStatus() {
            setTimeout(() => {
                statusBar.style.display = 'none';
            }, 2000);
        }

        function showLoading() {
            articlesContainer.innerHTML = `
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <p style="color: #6b6b6b;">Завантаження статей...</p>
                </div>
            `;
        }

        function showError(error) {
            articlesContainer.innerHTML = `
                <div class="error-message">
                    <h3>Не вдалося завантажити статті</h3>
                    <p><strong>Деталі:</strong> ${error.message}</p>
                    <p style="margin-top: 16px;">
                        Переконайтеся, що backend запущений на http://127.0.0.1:8000
                        та CORS налаштований правильно.
                    </p>
                </div>
            `;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffTime = Math.abs(now - date);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays === 1) return 'Вчора';
            if (diffDays < 7) return `${diffDays} днів тому`;

            return date.toLocaleDateString('uk-UA', {
                month: 'short',
                day: 'numeric',
                year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined
            });
        }

        function getInitials(username) {
            return username.substring(0, 2).toUpperCase();
        }

        function displayArticles(articles) {
            if (!articles || articles.length === 0) {
                articlesContainer.innerHTML = `
                    <div class="empty-state">
                        <h2>Поки що статей немає</h2>
                        <p>Будьте першим, хто створить статтю</p>
                    </div>
                `;
                return;
            }

            const articlesHTML = articles.map(article => `
                <article class="article-card" onclick="viewArticle(${article.id})">
                    <div class="article-author-row">
                        <div class="author-avatar">${getInitials(article.author.username)}</div>
                        <div class="author-info">
                            <div class="author-name">${article.author.username}</div>
                            <div class="article-date">${formatDate(article.created_at)}</div>
                        </div>
                    </div>
                    <h2 class="article-title">${article.title}</h2>
                    <p class="article-excerpt">${article.content_preview}</p>
                    <div class="article-footer">
                        <div class="article-stats">
                            <span class="stat">👏 ${article.likes_count}</span>
                            <span class="stat">💬 ${article.comments_count}</span>
                        </div>
                    </div>
                </article>
            `).join('');

            articlesContainer.innerHTML = `
                <div class="articles-grid">
                    ${articlesHTML}
                </div>
            `;
        }

        async function loadArticles() {
            try {
                loadBtn.disabled = true;
                setStatus('Завантаження статей...');
                showLoading();

                const response = await fetch(`${API_BASE_URL}/articles/`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const result = await response.json();
                const articles = result.data || result;

                displayArticles(articles);
                setStatus(`Завантажено ${articles.length} статей`);
                hideStatus();

            } catch (error) {
                console.error('Error loading articles:', error);
                setStatus('Помилка завантаження');
                showError(error);
            } finally {
                loadBtn.disabled = false;
            }
        }
        createBtn.addEventListener('click', () => {
            if (checkAuth()) {
                window.location.href = 'news_list.html';
            } else {
                alert('Спочатку увійдіть в систему');
                localStorage.setItem('redirect_after_login', 'news_list.html');
                window.location.href = 'login.html';
            }
        });

        function viewArticle(id) {
            window.location.href = `article_detail.html?id=${id}`;
        }

        loadBtn.addEventListener('click', loadArticles);

        window.addEventListener('DOMContentLoaded', () => {
            console.log('Frontend initialized. API:', API_BASE_URL);
            checkAuth();
        });
    </script>
</body>
</html>
