<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Blog</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #fafafa;
            color: #242424;
            line-height: 1.6;
        }

        header {
            background: #fff;
            border-bottom: 1px solid #e6e6e6;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            max-width: 1336px;
            margin: 0 auto;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #242424;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 99px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #1a8917;
            color: white;
        }

        .btn-primary:hover {
            background: #156d13;
        }

        .btn-secondary {
            background: transparent;
            color: #242424;
            border: 1px solid #242424;
        }

        .btn-secondary:hover {
            background: #242424;
            color: white;
        }

        .container {
            max-width: 1336px;
            margin: 0 auto;
            padding: 48px 24px;
        }

        .hero {
            background: #ffc017;
            border-bottom: 1px solid #242424;
            padding: 80px 24px;
            margin-bottom: 48px;
        }

        .hero-content {
            max-width: 1336px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 106px;
            font-weight: 400;
            font-family: 'GT Super Display', Georgia, serif;
            letter-spacing: -6px;
            line-height: 1;
            margin-bottom: 24px;
        }

        .hero p {
            font-size: 24px;
            color: #242424;
            max-width: 550px;
        }

        .articles-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e6e6e6;
        }

        .articles-header h2 {
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6b6b6b;
        }

        .filter-tabs {
            display: flex;
            gap: 24px;
        }

        .filter-tab {
            background: none;
            border: none;
            color: #6b6b6b;
            font-size: 14px;
            cursor: pointer;
            padding: 8px 0;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .filter-tab:hover,
        .filter-tab.active {
            color: #242424;
            border-bottom-color: #242424;
        }

        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 48px 32px;
        }

        .article-card {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .article-card:hover {
            transform: translateY(-2px);
        }

        .article-author-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .author-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        .author-info {
            display: flex;
            flex-direction: column;
        }

        .author-name {
            font-size: 13px;
            font-weight: 600;
            color: #242424;
        }

        .article-date {
            font-size: 12px;
            color: #6b6b6b;
        }

        .article-title {
            font-size: 22px;
            font-weight: 700;
            color: #242424;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .article-excerpt {
            font-size: 16px;
            color: #6b6b6b;
            margin-bottom: 16px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .article-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid #f2f2f2;
        }

        .article-stats {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: #6b6b6b;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .loading-container {
            text-align: center;
            padding: 80px 20px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #242424;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            max-width: 680px;
            margin: 80px auto;
            padding: 32px;
            background: #fff;
            border-radius: 4px;
            border-left: 4px solid #c94040;
        }

        .error-message h3 {
            color: #c94040;
            font-size: 20px;
            margin-bottom: 12px;
        }

        .error-message p {
            color: #6b6b6b;
            font-size: 15px;
            line-height: 1.6;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            max-width: 680px;
            margin: 0 auto;
        }

        .empty-state h2 {
            font-size: 32px;
            color: #242424;
            margin-bottom: 16px;
        }

        .empty-state p {
            font-size: 18px;
            color: #6b6b6b;
        }

        .status-bar {
            background: #f9f9f9;
            padding: 12px 24px;
            border-radius: 4px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1a8917;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 48px;
                letter-spacing: -2px;
            }

            .articles-grid {
                grid-template-columns: 1fr;
            }

            .header-container {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="/" class="logo">News Blog</a>
            <div class="header-actions">
                <button class="btn btn-secondary" id="loadArticles">Оновити</button>
                <button class="btn btn-primary" id="createArticle">Написати</button>
            </div>
        </div>
    </header>

    <div class="hero">
        <div class="hero-content">
            <h1>Stay curious.</h1>
            <p>Discover stories, thinking, and expertise from writers on any topic.</p>
        </div>
    </div>

    <div class="container">
        <div class="status-bar" id="statusBar" style="display: none;">
            <span class="status-dot"></span>
            <span id="statusText">Завантаження...</span>
        </div>

        <div class="articles-header">
            <h2>Останні статті</h2>
            <div class="filter-tabs">
                <button class="filter-tab active">Всі</button>
                <button class="filter-tab">Популярні</button>
                <button class="filter-tab">Нові</button>
            </div>
        </div>

        <div id="articlesContainer">
            <div class="empty-state">
                <h2>Ласкаво просимо</h2>
                <p>Завантажуємо статті з вашого API...</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000/api/v1';

        const statusBar = document.getElementById('statusBar');
        const statusText = document.getElementById('statusText');
        const articlesContainer = document.getElementById('articlesContainer');
        const loadBtn = document.getElementById('loadArticles');
        const createBtn = document.getElementById('createArticle');

        function setStatus(message) {
            statusBar.style.display = 'flex';
            statusText.textContent = message;
        }

        function hideStatus() {
            setTimeout(() => {
                statusBar.style.display = 'none';
            }, 2000);
        }

        function showLoading() {
            articlesContainer.innerHTML = `
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <p style="color: #6b6b6b;">Завантаження статей...</p>
                </div>
            `;
        }

        function showError(error) {
            articlesContainer.innerHTML = `
                <div class="error-message">
                    <h3>Не вдалося завантажити статті</h3>
                    <p><strong>Деталі:</strong> ${error.message}</p>
                    <p style="margin-top: 16px;">
                        Переконайтеся, що backend запущений на http://127.0.0.1:8000
                        та CORS налаштований правильно.
                    </p>
                </div>
            `;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffTime = Math.abs(now - date);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays === 1) return 'Вчора';
            if (diffDays < 7) return `${diffDays} днів тому`;

            return date.toLocaleDateString('uk-UA', {
                month: 'short',
                day: 'numeric',
                year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined
            });
        }

        function getInitials(username) {
            return username.substring(0, 2).toUpperCase();
        }

        function displayArticles(articles) {
            if (!articles || articles.length === 0) {
                articlesContainer.innerHTML = `
                    <div class="empty-state">
                        <h2>Поки що статей немає</h2>
                        <p>Будьте першим, хто створить статтю</p>
                    </div>
                `;
                return;
            }

            const articlesHTML = articles.map(article => `
                <article class="article-card" onclick="viewArticle(${article.id})">
                    <div class="article-author-row">
                        <div class="author-avatar">${getInitials(article.author.username)}</div>
                        <div class="author-info">
                            <div class="author-name">${article.author.username}</div>
                            <div class="article-date">${formatDate(article.created_at)}</div>
                        </div>
                    </div>
                    <h2 class="article-title">${article.title}</h2>
                    <p class="article-excerpt">${article.content_preview}</p>
                    <div class="article-footer">
                        <div class="article-stats">
                            <span class="stat">👏 ${article.likes_count}</span>
                            <span class="stat">💬 ${article.comments_count}</span>
                        </div>
                    </div>
                </article>
            `).join('');

            articlesContainer.innerHTML = `
                <div class="articles-grid">
                    ${articlesHTML}
                </div>
            `;
        }

        async function loadArticles() {
            try {
                loadBtn.disabled = true;
                setStatus('Завантаження статей...');
                showLoading();

                const response = await fetch(`${API_BASE_URL}/articles/`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const result = await response.json();
                const articles = result.data || result;

                displayArticles(articles);
                setStatus(`Завантажено ${articles.length} статей`);
                hideStatus();

            } catch (error) {
                console.error('Error loading articles:', error);
                setStatus('Помилка завантаження');
                showError(error);
            } finally {
                loadBtn.disabled = false;
            }
        }

        async function createTestArticle() {
            try {
                createBtn.disabled = true;
                setStatus('Створення статті...');

                const testArticle = {
                    title: `Нові можливості веб-розробки у ${new Date().getFullYear()} році`,
                    content: 'Сучасна веб-розробка стрімко розвивається. У цій статті ми розглянемо найновіші тренди та технології, які змінюють підхід до створення веб-додатків. Від передових фреймворків до інноваційних методологій - все, що вам потрібно знати для успішної кар\'єри розробника.',
                    author_id: 1
                };

                const response = await fetch(`${API_BASE_URL}/articles/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testArticle)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(JSON.stringify(errorData));
                }

                setStatus('Статтю створено успішно');
                hideStatus();

                setTimeout(() => {
                    loadArticles();
                }, 500);

            } catch (error) {
                console.error('Error creating article:', error);
                alert(`Помилка створення: ${error.message}`);
            } finally {
                createBtn.disabled = false;
            }
        }

        function viewArticle(id) {
            window.location.href = `article_detail.html?id=${id}`;
        }

        loadBtn.addEventListener('click', loadArticles);
        createBtn.addEventListener('click', createTestArticle);

        window.addEventListener('DOMContentLoaded', () => {
            console.log('Frontend initialized. API:', API_BASE_URL);
            loadArticles();
        });
    </script>
</body>
</html>
